services:
  doiter-backend:
    build:
      context: ./backend
    container_name: doiter-backend
    restart: unless-stopped
    environment:
      DOITER_DEBUG: "false"
      DOITER_SECRET_KEY: ${DOITER_SECRET_KEY:?Set DOITER_SECRET_KEY in .env}
      DOITER_ALLOWED_HOSTS: ${DOITER_ALLOWED_HOSTS:?Set DOITER_ALLOWED_HOSTS in .env}
      DOITER_CSRF_TRUSTED_ORIGINS: ${DOITER_CSRF_TRUSTED_ORIGINS:-}
      DOITER_DB_PATH: /data/db.sqlite3
      DOITER_SECURE_SSL_REDIRECT: ${DOITER_SECURE_SSL_REDIRECT:-false}
    volumes:
      - doiter-sqlite:/data
    expose:
      - "8000"
    networks:
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; host=os.environ['DOITER_ALLOWED_HOSTS'].split(',')[0].strip(); req=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': host}); urllib.request.urlopen(req, timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  doiter-sqlite:
    name: doiter-sqlite

networks:
  proxy:
    external: true
